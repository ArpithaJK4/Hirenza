# Zero-cost "server": runs the job hunter on GitHub's runners.
# Public repo = unlimited free minutes. Private repo = 2,000 free min/month -> use the hourly cron.
name: hunt

# Laptop mode is the default (scripts/start-local.sh), so this only runs when started manually.
# To use GitHub as an always-on scheduler: add the repo secrets (see README), then uncomment:
#  schedule:
#    - cron: "*/15 * * * *"
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore per-source intervals"
        type: boolean
        default: false

concurrency:
  group: hunt
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      LOG_LEVEL: WARNING
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CURRENT_EMPLOYER_NAMES: ${{ secrets.CURRENT_EMPLOYER_NAMES }}
      CURRENT_EMPLOYER_DOMAINS: ${{ secrets.CURRENT_EMPLOYER_DOMAINS }}
      SMTP_HOST: smtp.gmail.com
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GMAIL_IMAP_USER: ${{ secrets.GMAIL_IMAP_USER }}
      GMAIL_IMAP_APP_PASSWORD: ${{ secrets.GMAIL_IMAP_APP_PASSWORD }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CANDIDATE_FULL_NAME: ${{ secrets.CANDIDATE_FULL_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Fail fast if not configured
        run: |
          test -n "$DATABASE_URL" || { echo "::error::Add the DATABASE_URL secret"; exit 1; }
          test -n "$SECRET_KEY" || { echo "::error::Add the SECRET_KEY secret"; exit 1; }
      - run: alembic upgrade head
      - run: python -m app.cli bootstrap
      - run: python -m app.cli pipeline ${{ inputs.force && '--force' || '' }} > result.json
      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("result.json")
          if not p.exists() or not p.read_text().strip():
              print("No result"); raise SystemExit
          d = json.loads(p.read_text())
          print("| source | new | excluded | errors |\n|---|---|---|---|")
          for k, v in d["discovery"].get("sources", {}).items():
              print(f"| {k} | {v['new']} | {v['excluded']} | {len(v['errors'])} |")
          print(f"\nscored: {d['matching'].get('scored')} · high: {d['matching'].get('high')} · "
                f"alerted: {d['alerts'].get('alerted')}")
          PY
